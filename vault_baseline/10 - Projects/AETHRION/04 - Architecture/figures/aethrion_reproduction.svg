<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="900" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">Four zones, and the leaks that are not boundary crossings</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">A reproduction that could not have failed is not evidence. Separating who produces from who judges is the visible half of that, and it is the</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">half that gets tested. The half that gets missed is underneath: infrastructure the zones happen to share, where nothing crosses a boundary</text>
<text x="24.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">because the boundary was never in the path.</text>
<rect x="24.0" y="168.0" width="271.5" height="158.0" rx="4" fill="#edf5fa" stroke="#0072B2" stroke-width="2.2"/>
<text x="159.8" y="198.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0072B2" text-anchor="middle">Producer</text>
<text x="38.0" y="220.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">writes the method and the code</text>
<path d="M 38.0 264 L 281.5 264" fill="none" stroke="#C8C8C8" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="38.0" y="284.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#D55E00" text-anchor="start">may never read hidden test</text>
<text x="38.0" y="304.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#D55E00" text-anchor="start">material</text>
<rect x="317.5" y="168.0" width="271.5" height="158.0" rx="4" fill="#fdf8ed" stroke="#E69F00" stroke-width="2.2"/>
<text x="453.2" y="198.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#E69F00" text-anchor="middle">Evaluator</text>
<text x="331.5" y="220.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">runs the frozen contract, emits</text>
<text x="331.5" y="240.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">raw output</text>
<path d="M 331.5 264 L 575.0 264" fill="none" stroke="#C8C8C8" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="331.5" y="284.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#D55E00" text-anchor="start">its source and hidden data are</text>
<text x="331.5" y="304.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#D55E00" text-anchor="start">unreachable from the producer</text>
<path d="M 298.5 247.0 L 312.5 247.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="611.0" y="168.0" width="271.5" height="158.0" rx="4" fill="#edf8f5" stroke="#009E73" stroke-width="2.2"/>
<text x="746.8" y="198.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#009E73" text-anchor="middle">Reproducer</text>
<text x="625.0" y="220.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">same package, no agent present</text>
<path d="M 625.0 264 L 868.5 264" fill="none" stroke="#C8C8C8" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="625.0" y="284.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#D55E00" text-anchor="start">no lineage to the producer&#x27;s</text>
<text x="625.0" y="304.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#D55E00" text-anchor="start">environment</text>
<path d="M 592.0 247.0 L 606.0 247.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="904.5" y="168.0" width="271.5" height="158.0" rx="4" fill="#fbf6f9" stroke="#CC79A7" stroke-width="2.2"/>
<text x="1040.2" y="198.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#CC79A7" text-anchor="middle">Grader</text>
<text x="918.5" y="220.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">judges the reproduction</text>
<text x="918.5" y="240.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">independently</text>
<path d="M 918.5 264 L 1162.0 264" fill="none" stroke="#C8C8C8" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="918.5" y="284.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#D55E00" text-anchor="start">did not produce and did not</text>
<text x="918.5" y="304.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#D55E00" text-anchor="start">reproduce</text>
<path d="M 885.5 247.0 L 899.5 247.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="24.0" y="156.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#63666A" text-anchor="start">permitted flow — artifacts move right, authority never moves left</text>
<text x="24.0" y="366.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">The paths ACC-113 plants — each defeats the zones above without crossing a boundary</text>
<rect x="24.0" y="392.0" width="274.5" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="161.2" y="433.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">a shared cache</text>
<text x="161.2" y="457.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the reproduction is fast because it</text>
<text x="161.2" y="476.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">never really ran</text>
<path d="M 161.25 386 L 161.25 366" fill="none" stroke="#D55E00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrowsm)"/>
<rect x="316.5" y="392.0" width="274.5" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="453.8" y="433.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">an inherited credential</text>
<text x="453.8" y="457.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the reproducer reaches what only</text>
<text x="453.8" y="476.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the producer should</text>
<path d="M 453.75 386 L 453.75 366" fill="none" stroke="#D55E00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrowsm)"/>
<rect x="609.0" y="392.0" width="274.5" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="746.2" y="433.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">a warm container layer</text>
<text x="746.2" y="457.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the environment carries the</text>
<text x="746.2" y="476.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">producer&#x27;s state</text>
<path d="M 746.25 386 L 746.25 366" fill="none" stroke="#D55E00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrowsm)"/>
<rect x="901.5" y="392.0" width="274.5" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="1038.8" y="433.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">a hosted model snapshot</text>
<text x="1038.8" y="457.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">silently replaced between the two</text>
<text x="1038.8" y="476.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">runs</text>
<path d="M 1038.75 386 L 1038.75 366" fill="none" stroke="#D55E00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrowsm)"/>
<text x="24.0" y="546.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">What a reproduction status is allowed to claim</text>
<rect x="24.0" y="572.0" width="370.7" height="130.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="209.3" y="619.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">EXACT</text>
<text x="209.3" y="643.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">bit-identical, and only where the substrate can</text>
<text x="209.3" y="662.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">support it. A hosted black-box model cannot.</text>
<rect x="414.7" y="572.0" width="370.7" height="130.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="600.0" y="619.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">DISTRIBUTIONAL</text>
<text x="600.0" y="643.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">within a declared tolerance, with the interval</text>
<text x="600.0" y="662.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">reported rather than the point.</text>
<rect x="805.3" y="572.0" width="370.7" height="130.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="990.7" y="610.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">REPEATABILITY</text>
<text x="990.7" y="634.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the run executed despite failing an</text>
<text x="990.7" y="653.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">independence check — classified, with the</text>
<text x="990.7" y="672.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">reason, never discarded.</text>
<rect x="24.0" y="726.0" width="1152.0" height="88.0" rx="4" fill="#fbefe6" stroke="#D55E00" stroke-width="2.2"/>
<text x="42.0" y="754.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">The rule that makes the zones worth drawing</text>
<text x="42.0" y="776.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Reproduced status is refused by environment digest lineage, not by declaration. An agent that produced a result may not reproduce it, and an</text>
<text x="42.0" y="798.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">environment carrying the producer&#x27;s cached layers has reproduced the environment rather than the finding. ACC-20, ACC-114.</text>
<text x="24.0" y="838.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Status: specified, not built. WP-157 owns the leakage suite; no zone exists, no lineage is computed, and no injection has ever been run.</text>
</svg>
