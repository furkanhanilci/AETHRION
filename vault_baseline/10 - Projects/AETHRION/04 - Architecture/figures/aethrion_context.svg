<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="960" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">Context projection — what is shown, and why the rest is not</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">An agent never receives the project. It receives a projection assembled for one invocation. Two different reasons remove material from it,</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">and collapsing them is the mistake: one is cost, and one is independence. A larger context window fixes the first and makes the second</text>
<text x="24.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">WORSE.</text>
<text x="24.0" y="166.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">1 · Two reasons to leave something out, and only one is about tokens</text>
<rect x="24.0" y="192.0" width="564.0" height="150.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="306.0" y="240.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Left out because it costs</text>
<text x="306.0" y="265.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">Superseded drafts, resolved threads, material already summarised.</text>
<text x="306.0" y="284.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">Removing it is a saving and nothing more: if the window were infinite,</text>
<text x="306.0" y="303.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">including it would do no harm.</text>
<rect x="612.0" y="192.0" width="564.0" height="150.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="894.0" y="240.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Left out because reading it would compromise the work</text>
<text x="894.0" y="265.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">The producer&#x27;s dead ends, framing and search experience. A reviewer</text>
<text x="894.0" y="284.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">who reads them inherits them, and the review is anchored before it starts.</text>
<text x="894.0" y="303.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">An infinite window makes this worse — ACC-072, ACC-079.</text>
<text x="24.0" y="378.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">2 · What one invocation is assembled from</text>
<rect x="24.0" y="404.0" width="277.5" height="96.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="162.8" y="434.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">frozen constraints</text>
<text x="162.8" y="457.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the protocol, the analysis plan,</text>
<text x="162.8" y="476.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the gate</text>
<rect x="315.5" y="404.0" width="277.5" height="96.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="454.2" y="443.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">evidence in scope</text>
<text x="454.2" y="466.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">only what this claim rests on</text>
<rect x="607.0" y="404.0" width="277.5" height="96.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="745.8" y="434.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">the task itself</text>
<text x="745.8" y="457.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">one step, with its acceptance</text>
<text x="745.8" y="476.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">condition</text>
<rect x="898.5" y="404.0" width="277.5" height="96.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="1037.2" y="434.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">peer deltas</text>
<text x="1037.2" y="457.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">material differences, never a</text>
<text x="1037.2" y="476.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">transcript</text>
<path d="M 162.75 502 L 162.75 514 L 600.0 514 L 600.0 525" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 454.25 502 L 454.25 514 L 600.0 514 L 600.0 525" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 745.75 502 L 745.75 514 L 600.0 514 L 600.0 525" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 1037.25 502 L 1037.25 514 L 600.0 514 L 600.0 525" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="440.0" y="530.0" width="320.0" height="72.0" rx="4" fill="#e0eef6" stroke="#0072B2" stroke-width="2.4"/>
<text x="600.0" y="560.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0072B2" text-anchor="middle">ContextProjectionRecord</text>
<text x="600.0" y="584.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">what was shown, and what was masked</text>
<text x="24.0" y="638.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">3 · A mask is not a delete</text>
<rect x="24.0" y="664.0" width="277.5" height="92.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="162.8" y="692.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">refuted</text>
<text x="162.8" y="716.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">a conclusion the evidence</text>
<text x="162.8" y="735.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">stopped supporting</text>
<rect x="315.5" y="664.0" width="277.5" height="92.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="454.2" y="692.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">masked</text>
<text x="454.2" y="716.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">removed from the reasoning</text>
<text x="454.2" y="735.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">context</text>
<path d="M 303.5 710 L 310.5 710" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="607.0" y="664.0" width="277.5" height="92.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="745.8" y="692.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">still queryable</text>
<text x="745.8" y="716.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">as history, by anyone asking</text>
<text x="745.8" y="735.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">about history</text>
<path d="M 595.0 710 L 602.0 710" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="898.5" y="664.0" width="277.5" height="92.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="1037.2" y="692.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">never returns</text>
<text x="1037.2" y="716.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">not as current, on any reload —</text>
<text x="1037.2" y="735.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">ACC-096</text>
<path d="M 886.5 710 L 893.5 710" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="24.0" y="784.0" width="1152.0" height="104.0" rx="4" fill="#fbefe6" stroke="#D55E00" stroke-width="2.2"/>
<text x="42.0" y="812.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">The two failures this prevents, and they pull opposite ways</text>
<text x="42.0" y="834.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">A refuted conclusion surviving compaction and returning as current — and a frozen constraint dropping out of context so the step that would</text>
<text x="42.0" y="856.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">violate it proceeds unchallenged. One asks for less to be carried forward and the other for more, which is why the projection is assembled per</text>
<text x="42.0" y="878.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">invocation rather than trimmed from a running transcript. ACC-096, ACC-097.</text>
<text x="24.0" y="916.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Status: specified, not built. WP-151 owns it; there is no projection record, no mask and no memory intervention anywhere in this repository.</text>
</svg>
