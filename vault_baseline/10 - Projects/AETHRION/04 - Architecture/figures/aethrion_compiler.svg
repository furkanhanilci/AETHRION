<rect width="1200" height="1130" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">The Task Compiler — what a task becomes before an agent runs</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">The number of agents is an OUTPUT, not a setting. A task that needs three independent cognitive functions compiles to three; one that</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">needs one compiles to one; and neither is a knob a deadline can turn. Everything below is derived from the task&#x27;s own properties before any</text>
<text x="24.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">agent is invoked, which is what makes “was this reviewed independently?” a query rather than an assertion.</text>
<text x="24.0" y="166.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">1 · What it reads</text>
<rect x="24.0" y="190.0" width="258.0" height="62.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="153.0" y="212.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">task class</text>
<text x="153.0" y="235.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">what kind of work this is</text>
<rect x="296.0" y="190.0" width="258.0" height="62.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="425.0" y="212.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">scientific phase</text>
<text x="425.0" y="235.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">which gate it sits before</text>
<rect x="568.0" y="190.0" width="258.0" height="62.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="697.0" y="203.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">roles required</text>
<text x="697.0" y="226.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the governance functions in</text>
<text x="697.0" y="245.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">play</text>
<rect x="24.0" y="264.0" width="258.0" height="62.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="153.0" y="286.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">evidence dependencies</text>
<text x="153.0" y="309.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">what it must read to proceed</text>
<rect x="296.0" y="264.0" width="258.0" height="62.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="425.0" y="286.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">independence requirement</text>
<text x="425.0" y="309.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the assurance class it inherits</text>
<rect x="568.0" y="264.0" width="258.0" height="62.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="697.0" y="277.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">budget</text>
<text x="697.0" y="300.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">what is affordable, and what is</text>
<text x="697.0" y="319.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">reserved</text>
<text x="24.0" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">2 · The compilation, and the contracts it emits — every one binding</text>
<rect x="390.0" y="384.0" width="420.0" height="78.0" rx="4" fill="#e0eef6" stroke="#0072B2" stroke-width="2.4"/>
<text x="600.0" y="416.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#0072B2" text-anchor="middle">Task Compiler</text>
<text x="600.0" y="442.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">WP-047 · derives, never asks</text>
