<text x="210.0" y="557.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the actors, and why each is there</text>
<rect x="408.0" y="506.0" width="372.0" height="74.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="594.0" y="534.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">CognitiveDiversityProfile</text>
<text x="594.0" y="557.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">independence across five dimensions</text>
<rect x="792.0" y="506.0" width="372.0" height="74.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="978.0" y="534.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">CommunicationTopology</text>
<text x="978.0" y="557.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">which edge may carry which message type</text>
<rect x="24.0" y="592.0" width="372.0" height="74.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="210.0" y="620.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">ContextProjection</text>
<text x="210.0" y="643.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">what each actor is shown, and what is masked</text>
<rect x="408.0" y="592.0" width="372.0" height="74.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="594.0" y="611.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">ResearchBudgetContract</text>
<text x="594.0" y="634.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">spend, and the reserve exploration cannot</text>
<text x="594.0" y="653.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">reach</text>
