<text x="978.0" y="634.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">V0–V3 per claim, chosen before the work</text>
<text x="978.0" y="653.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">starts</text>
<path d="M 600.0 464 L 600.0 472 L 210.0 472 L 210.0 501" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 600.0 464 L 600.0 472 L 594.0 472 L 594.0 501" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 600.0 464 L 600.0 472 L 978.0 472 L 978.0 501" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="24.0" y="704.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">3 · The output that is not a cohort</text>
<rect x="24.0" y="728.0" width="565.0" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="306.5" y="760.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Compilation refuses</text>
<text x="306.5" y="785.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">A task needing independent review that cannot be given it does not</text>
<text x="306.5" y="804.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">compile to one agent with a note. It compiles to nothing, and the refusal</text>
<text x="306.5" y="823.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">names what was missing — ACC-081.</text>
<rect x="611.0" y="728.0" width="565.0" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="893.5" y="770.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">BLOCKED_BUDGET</text>
<text x="893.5" y="795.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">A task that cannot afford its required assurance is blocked or asks for a</text>
<text x="893.5" y="814.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">scope reduction. It does not proceed more cheaply — ACC-101.</text>
<rect x="24.0" y="870.0" width="1152.0" height="106.0" rx="4" fill="#fbefe6" stroke="#D55E00" stroke-width="2.2"/>
<text x="42.0" y="898.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">Why this is a compiler and not a configuration file</text>
<text x="42.0" y="920.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Every cost pressure a multi-agent system experiences argues for fewer agents, and a setting can be turned down. A derivation cannot: the</text>
<text x="42.0" y="942.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">cohort follows from the task, so reducing it means changing what the task claims to be — which is a scope decision, made in the open, by a</text>
<text x="42.0" y="964.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">human.</text>
<text x="24.0" y="1004.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Status: specified, not built. WP-047 owns the compiler and emits no cohort today; WP-042 records that it must stop emitting a bare skill list. Nothing in this</text>
<text x="24.0" y="1025.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">figure runs.</text>
</svg>
