<path d="M 425.0 328 L 425.0 368 L 600.0 368 L 600.0 379" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 697.0 328 L 697.0 368 L 600.0 368 L 600.0 379" fill="none" stroke="#C8C8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
