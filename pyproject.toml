[project]
name = "airl-bridge-api"
version = "0.1.0"
description = "AETHRION literature bridge — a local, read-only Zotero to canonical registry and Obsidian projection, with a five-tool read-only MCP surface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    # Imported directly by airl_bridge.models. It arrives transitively through
    # FastAPI, but a direct import is a direct dependency: declaring it is what
    # stops a FastAPI change from breaking this package silently.
    "pydantic>=2.7,<3",
    "mcp>=1.27,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
airl-bridge = "airl_bridge.cli:main"
airl-bridge-mcp = "airl_bridge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airl_bridge", "src/airl_framework"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
