[project]
name = "airl-bridge-api"
version = "0.1.0"
description = "Local read-only Zotero to AIRL canonical registry and Obsidian bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=1.27,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
airl-bridge = "airl_bridge.cli:main"
airl-bridge-mcp = "airl_bridge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airl_bridge"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
