    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="1010" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">How a document is produced, and what may decide</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">The pipeline runs evidence first and formatting last. A renderer exiting zero means the document rendered; it says nothing about whether</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">the document is true, complete or publishable.</text>
<text x="24.0" y="130.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Every external tool below produces a signal. None of them decides.</text>
<text x="24.0" y="174.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">(a)  The pipeline — formatting is downstream</text>
<rect x="24.0" y="192.0" width="376.0" height="74.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="212.0" y="221.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">0. Evidence</text>
<text x="212.0" y="245.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">sources · runs · gaps · contradictions</text>
<path d="M 401.0 229.0 L 409.0 229.0" fill="none" stroke="#63666A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="412.0" y="192.0" width="376.0" height="74.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="600.0" y="221.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">1. Claims</text>
<text x="600.0" y="245.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">typed, scoped, before any prose</text>
<path d="M 789.0 229.0 L 797.0 229.0" fill="none" stroke="#63666A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="800.0" y="192.0" width="376.0" height="74.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="988.0" y="221.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">2. Structure</text>
<text x="988.0" y="245.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">archetype · outline · narrative</text>
<rect x="24.0" y="278.0" width="376.0" height="74.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="212.0" y="307.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">3. Draft</text>
<text x="212.0" y="331.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">section by section from the matrix</text>
<path d="M 401.0 315.0 L 409.0 315.0" fill="none" stroke="#63666A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="412.0" y="278.0" width="376.0" height="74.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="600.0" y="307.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">4. Figures &amp; tables</text>
<text x="600.0" y="331.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">inventory first, then produced</text>
<path d="M 789.0 315.0 L 797.0 315.0" fill="none" stroke="#63666A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="800.0" y="278.0" width="376.0" height="74.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="988.0" y="297.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">5. QA</text>
<text x="988.0" y="321.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">scientific · statistical · guideline · language ·</text>
<text x="988.0" y="340.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">venue</text>
<rect x="24.0" y="364.0" width="376.0" height="74.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="212.0" y="393.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">6. Render</text>
<text x="212.0" y="417.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">only the formats the contract requires</text>
<path d="M 401.0 401.0 L 409.0 401.0" fill="none" stroke="#63666A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="412.0" y="364.0" width="376.0" height="74.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="600.0" y="393.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">7. Artifact QA</text>
<text x="600.0" y="417.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">inspect the PDF, not the source</text>
<path d="M 789.0 401.0 L 797.0 401.0" fill="none" stroke="#63666A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="800.0" y="364.0" width="376.0" height="74.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="988.0" y="393.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">8. Review</text>
<text x="988.0" y="417.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">through the existing review skills</text>
<text x="24.0" y="458.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Stages 0 to 2 finish before a renderer is chosen. A document whose first decision was its template has already skipped the only stage that could have</text>
<text x="24.0" y="479.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">stopped it.</text>
<path d="M 24 510 L 1176 510" fill="none" stroke="#C8C8C8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24.0" y="540.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">(b)  Four objects that are not the same thing</text>
<rect x="24.0" y="558.0" width="277.5" height="88.0" rx="4" fill="#d6efe9" stroke="#009E73" stroke-width="2.2"/>
<text x="162.8" y="593.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">DocumentSource</text>
<text x="162.8" y="616.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the editable canonical source</text>
<rect x="315.5" y="558.0" width="277.5" height="88.0" rx="4" fill="#edf5fa" stroke="#63666A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="454.2" y="593.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#63666A" text-anchor="middle">RenderedDocument</text>
<text x="454.2" y="616.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">an artifact, not a verdict</text>
<path d="M 302.5 602 L 311.5 602" fill="none" stroke="#63666A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="607.0" y="558.0" width="277.5" height="88.0" rx="4" fill="#fdf8ed" stroke="#63666A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="745.8" y="584.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#63666A" text-anchor="middle">PublicationPackage</text>
<text x="745.8" y="607.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">claims resolved · QA ·</text>
<text x="745.8" y="626.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">provenance · hashes</text>
<path d="M 594.0 602 L 603.0 602" fill="none" stroke="#63666A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="898.5" y="558.0" width="277.5" height="88.0" rx="4" fill="#fbf6f9" stroke="#63666A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1037.2" y="593.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#63666A" text-anchor="middle">SubmissionExchange</text>
<text x="1037.2" y="616.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">MECA · publisher bundle</text>
<path d="M 885.5 602 L 894.5 602" fill="none" stroke="#63666A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="24.0" y="672.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">A rendered document does not become a publication package because rendering succeeded. Between them sit resolved claims, recorded QA,</text>
<text x="24.0" y="695.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">captured provenance — and a human decision at G9.</text>
<rect x="24.0" y="724.0" width="1152.0" height="96.0" rx="4" fill="#fcf4ed" stroke="#D55E00" stroke-width="1.6"/>
<text x="40.0" y="754.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">Authority</text>
<text x="154.0" y="754.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Quarto · Pandoc · Typst</text>
<text x="154.0" y="794.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">may: render · resolve</text>
<text x="154.0" y="816.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">references</text>
<text x="408.0" y="754.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Crossref · OpenAlex</text>
<text x="408.0" y="794.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">may: say a record exists</text>
<text x="662.0" y="754.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Vale · LanguageTool</text>
<text x="662.0" y="794.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">may: suggest wording</text>
<text x="916.0" y="754.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">veraPDF</text>
<text x="916.0" y="794.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">may: test PDF rules</text>
<text x="40.0" y="794.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" font-style="normal" fill="#D55E00" text-anchor="start">None of them</text>
<path d="M 24 838 L 1176 838" fill="none" stroke="#C8C8C8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24.0" y="868.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">Status</text>
<text x="94.0" y="868.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">The skill, its reference modules and the resolution checks exist and run. No renderer is installed here, so no document in this repository has</text>
<text x="94.0" y="891.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">been rendered, and the authoring backend has not been chosen — the bake-off is specified and unexecuted.</text>
