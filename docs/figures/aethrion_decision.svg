<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="100%" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="1000" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">A human decision, and the order that makes it a judgement</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">A DecisionRecord signed after reading a confident recommendation and one signed before it look identical. That is the whole problem: the</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">record cannot carry the difference, so the PROCEDURE has to. The preliminary assessment is written first and sealed, and only then does</text>
<text x="24.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">the recommendation become reachable through any interface.</text>
<text x="24.0" y="166.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">1 · The order, and the boundary that enforces it</text>
<rect x="24.0" y="192.0" width="210.0" height="118.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="129.0" y="224.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">packet</text>
<text x="129.0" y="248.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">evidence, dissent and</text>
<text x="129.0" y="267.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">open findings — no</text>
<text x="129.0" y="286.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">recommendation in it</text>
<rect x="258.0" y="192.0" width="210.0" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="363.0" y="224.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">preliminary</text>
<text x="363.0" y="248.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the human&#x27;s own</text>
<text x="363.0" y="267.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">reading, written before</text>
<text x="363.0" y="286.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">any advice</text>
<path d="M 237 251.0 L 253 251.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="492.0" y="192.0" width="210.0" height="118.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="597.0" y="233.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">SEAL</text>
<text x="597.0" y="257.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">digest fixed; checkable</text>
<text x="597.0" y="276.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">long after the fact</text>
<path d="M 471 251.0 L 487 251.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="726.0" y="192.0" width="210.0" height="118.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="831.0" y="233.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">recommendation</text>
<text x="831.0" y="257.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the AI may now advise,</text>
<text x="831.0" y="276.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">and only advise</text>
<path d="M 705 251.0 L 721 251.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="960.0" y="192.0" width="210.0" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="1065.0" y="224.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">decision</text>
<text x="1065.0" y="248.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">signed, with the delta</text>
<text x="1065.0" y="267.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">from the preliminary</text>
<text x="1065.0" y="286.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">recorded</text>
<path d="M 939 251.0 L 955 251.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 714.0 178 L 714.0 316" fill="none" stroke="#D55E00" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714.0" y="170.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="middle">nothing to the right is reachable until the seal exists</text>
<text x="24.0" y="348.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">The DecisionDelta is the point of sealing. It is the measured distance between what the human thought and what the human signed — a quantity</text>
<text x="24.0" y="370.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">that does not exist unless the first was recorded before the second was influenced. A delta of zero on every decision is not agreement; it is the</text>
<text x="24.0" y="392.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">signature of a ratification process. ACC-110, ACC-112.</text>
<text x="24.0" y="446.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">2 · Three things that are not decisions</text>
<rect x="24.0" y="472.0" width="370.7" height="132.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="209.3" y="511.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">a timeout</text>
<text x="209.3" y="535.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">escalates, through every interface. It never</text>
<text x="209.3" y="554.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">becomes an approval, and no queue length</text>
<text x="209.3" y="573.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">changes that</text>
<rect x="414.7" y="472.0" width="370.7" height="132.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="600.0" y="511.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">INSUFFICIENT_BASIS</text>
<text x="600.0" y="535.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">a first-class outcome, not a failure to decide.</text>
<text x="600.0" y="554.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">The packet was not enough, and saying so is</text>
<text x="600.0" y="573.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the correct answer</text>
<rect x="805.3" y="472.0" width="370.7" height="132.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="990.7" y="511.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">an attention score</text>
<text x="990.7" y="535.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">may order a queue and may not decide</text>
<text x="990.7" y="554.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">anything. authority=false is a field, not a</text>
<text x="990.7" y="573.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">convention</text>
<text x="24.0" y="636.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">3 · Friction symmetry — the asymmetry that quietly decides</text>
<rect x="24.0" y="662.0" width="563.0" height="140.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="305.5" y="705.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Accepting a recommendation</text>
<text x="305.5" y="730.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">One click, no justification required, no record of what was weighed. This</text>
<text x="305.5" y="749.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">is the path of least resistance and it is the one the system makes</text>
<text x="305.5" y="768.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">cheapest.</text>
<rect x="613.0" y="662.0" width="563.0" height="140.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="894.5" y="715.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Rejecting one</text>
<text x="894.5" y="740.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">A written reason, a named alternative, a re-review. Every step is</text>
<text x="894.5" y="759.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">defensible on its own, and together they price disagreement.</text>
<rect x="24.0" y="822.0" width="1152.0" height="104.0" rx="4" fill="#fbefe6" stroke="#D55E00" stroke-width="2.2"/>
<text x="42.0" y="850.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">The requirement</text>
<text x="42.0" y="872.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Accepting and rejecting must cost the same. A system where agreement is one click and disagreement is a form has not left the decision to the</text>
<text x="42.0" y="894.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">human — it has left them the option of disagreeing, which is a different thing, and the difference does not appear anywhere in the record.</text>
<text x="42.0" y="916.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">ACC-112.</text>
<text x="24.0" y="940.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Status: specified, not built. WP-156 owns it; there is no HumanPreliminaryAssessment record, no DecisionDelta and no measurement of friction anywhere in</text>
<text x="24.0" y="961.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">this repository.</text>
</svg>
