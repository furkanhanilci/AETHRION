<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="100%" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="1400" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">One canonical owner per kind of state</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Ask “where does this live?” of any fact in this system and several components answer plausibly — a workflow engine, a relational store, an</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">object store, an event bus, a graph projection, a vector index and two human workspaces. The invariant is not how many there are; it is that</text>
<text x="24.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">each KIND of state has exactly one owner, and everything else is a projection that can be destroyed and rebuilt without loss.</text>
<text x="24.0" y="164.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">State</text>
<text x="339.0" y="164.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#E69F00" text-anchor="start">Canonical owner</text>
<text x="684.0" y="164.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#63666A" text-anchor="start">Everything else</text>
<path d="M 24 176 L 1176 176" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24.0" y="196.0" width="5.0" height="36.0" rx="2" fill="#E69F00" stroke="none" stroke-width="0"/>
<text x="40.0" y="214.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Gate and lifecycle position</text>
<text x="339.0" y="214.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#E69F00" text-anchor="start">Temporal</text>
<text x="684.0" y="214.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">an event announcing a transition is a notification</text>
<rect x="24.0" y="234.0" width="1152.0" height="54.0" rx="4" fill="#f7f7f8" stroke="none" stroke-width="0"/>
<rect x="24.0" y="256.0" width="5.0" height="36.0" rx="2" fill="#E69F00" stroke="none" stroke-width="0"/>
<text x="40.0" y="274.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Scientific domain records</text>
<text x="339.0" y="274.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#E69F00" text-anchor="start">PostgreSQL</text>
<text x="684.0" y="274.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Neo4j, pgvector and OpenSearch project it</text>
<rect x="24.0" y="316.0" width="5.0" height="36.0" rx="2" fill="#E69F00" stroke="none" stroke-width="0"/>
<text x="40.0" y="334.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Artifact bytes and digests</text>
<text x="339.0" y="334.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#E69F00" text-anchor="start">Immutable object store</text>
<text x="684.0" y="334.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">any local copy is a cache</text>
<rect x="24.0" y="354.0" width="1152.0" height="54.0" rx="4" fill="#f7f7f8" stroke="none" stroke-width="0"/>
<rect x="24.0" y="376.0" width="5.0" height="36.0" rx="2" fill="#D55E00" stroke="none" stroke-width="0"/>
<text x="40.0" y="394.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Human decisions</text>
<text x="339.0" y="394.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#D55E00" text-anchor="start">Signed DecisionRecord</text>
<text x="684.0" y="394.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">a message about a decision is not one</text>
<rect x="24.0" y="436.0" width="5.0" height="36.0" rx="2" fill="#0072B2" stroke="none" stroke-width="0"/>
<text x="40.0" y="454.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Cognitive scratch state</text>
<text x="339.0" y="454.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#0072B2" text-anchor="start">LangGraph, bounded to one task</text>
<text x="684.0" y="454.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">it cannot transition a gate</text>
<rect x="24.0" y="474.0" width="1152.0" height="54.0" rx="4" fill="#f7f7f8" stroke="none" stroke-width="0"/>
<rect x="24.0" y="496.0" width="5.0" height="36.0" rx="2" fill="#63666A" stroke="none" stroke-width="0"/>
<text x="40.0" y="514.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Experiment telemetry</text>
<text x="339.0" y="514.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#63666A" text-anchor="start">MLflow</text>
<text x="684.0" y="514.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">operational only — never a scientific result</text>
<rect x="24.0" y="556.0" width="5.0" height="36.0" rx="2" fill="#56B4E9" stroke="none" stroke-width="0"/>
<text x="40.0" y="574.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Literature working surface</text>
<text x="339.0" y="574.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#56B4E9" text-anchor="start">Zotero, human regions respected</text>
<text x="684.0" y="574.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">the Source Registry owns bibliographic identity</text>
<rect x="24.0" y="594.0" width="1152.0" height="54.0" rx="4" fill="#f7f7f8" stroke="none" stroke-width="0"/>
<rect x="24.0" y="616.0" width="5.0" height="36.0" rx="2" fill="#56B4E9" stroke="none" stroke-width="0"/>
<text x="40.0" y="634.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Human synthesis surface</text>
<text x="339.0" y="634.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#56B4E9" text-anchor="start">Obsidian, human regions respected</text>
<text x="684.0" y="634.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">generated regions are projections and say so</text>
<path d="M 24 674 L 1176 674" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24.0" y="696.0" width="1152.0" height="56.0" rx="4" fill="#fcf5e6" stroke="#E69F00" stroke-width="1.6"/>
<text x="40.0" y="720.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">The line that does the most work: MLflow answers what the system DID. An EvidenceManifest plus the run registry answers what may be</text>
<text x="40.0" y="741.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">BELIEVED. Operational telemetry is not provenance.</text>
<text x="24.0" y="784.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">The write path — the ordering is the mechanism</text>
<rect x="24.0" y="810.0" width="274.5" height="92.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="161.2" y="838.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">canonical txn + outbox</text>
<text x="161.2" y="861.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">committed ATOMICALLY,</text>
<text x="161.2" y="880.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">together</text>
<rect x="316.5" y="810.0" width="274.5" height="92.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="453.8" y="847.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">publisher</text>
<text x="453.8" y="870.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">reads the outbox afterwards</text>
<path d="M 301.5 856 L 311.5 856" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="609.0" y="810.0" width="274.5" height="92.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="746.2" y="847.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">consumer</text>
<text x="746.2" y="870.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">validates identity and version</text>
<path d="M 594.0 856 L 604.0 856" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="901.5" y="810.0" width="274.5" height="92.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="1038.8" y="847.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">re-reads canonical</text>
<text x="1038.8" y="870.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">never promotes a payload to truth</text>
<path d="M 886.5 856 L 896.5 856" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="24.0" y="934.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Getting this backwards is the standard way a distributed system acquires two truths: publish first, commit second, and a crash between them leaves</text>
<text x="24.0" y="956.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">an event describing something that never happened.</text>
<text x="24.0" y="1006.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">Why it is an injection suite and not a property</text>
<rect x="24.0" y="1032.0" width="374.7" height="54.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="211.3" y="1062.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">kill the publisher after the DB commit</text>
<rect x="412.7" y="1032.0" width="374.7" height="54.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="600.0" y="1062.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">deliver the same event twice</text>
<rect x="801.3" y="1032.0" width="374.7" height="54.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="988.7" y="1062.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">deliver events out of order</text>
<rect x="24.0" y="1094.0" width="374.7" height="54.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="211.3" y="1124.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">return a cancelled task&#x27;s late result</text>
<rect x="412.7" y="1094.0" width="374.7" height="54.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="600.0" y="1124.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">drop a projection and rebuild it</text>
<rect x="801.3" y="1094.0" width="374.7" height="54.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="988.7" y="1124.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">replay a workflow after a restart</text>
<rect x="24.0" y="1156.0" width="374.7" height="54.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="211.3" y="1186.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">two concurrent gate transitions</text>
<rect x="24.0" y="1226.0" width="1152.0" height="88.0" rx="4" fill="#fbefe6" stroke="#D55E00" stroke-width="2.2"/>
<text x="42.0" y="1254.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">A silent divergence is the failure</text>
<text x="42.0" y="1276.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Every injection must end with canonical state correct and the projection agreeing, or with an explicit recorded failure. Split brain is invisible in a</text>
<text x="42.0" y="1298.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">healthy system and obvious only in a post-mortem, so nothing short of causing one demonstrates it would be caught. ACC-119.</text>
<text x="24.0" y="1340.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Status: one store in the table exists — SQLite behind the Zotero bridge. Temporal, PostgreSQL, the object store, NATS, Neo4j and MLflow are</text>
<text x="24.0" y="1361.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">unimplemented, and the injection suite has never run.</text>
</svg>
