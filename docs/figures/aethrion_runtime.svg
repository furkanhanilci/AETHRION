<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" width="100%" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="1030" fill="#FFFFFF"/>
<text x="24.0" y="46.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">Cognition is chosen first; the runtime is chosen second</text>
<text x="24.0" y="78.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">The Task Compiler never emits “a Hermes agent”. It emits a cognitive function, a role contract, capability and context requirements and an</text>
<text x="24.0" y="102.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">independence constraint — and a runtime selector matches a qualified profile to those afterwards. Selecting the runtime first and then</text>
<text x="24.0" y="126.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">inventing roles that fit it is how a cohort comes to be shaped by a harness rather than by the question.</text>
<rect x="24.0" y="168.0" width="178.7" height="126.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="113.3" y="204.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Task</text>
<text x="113.3" y="228.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">classified, with its</text>
<text x="113.3" y="247.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">risk and assurance</text>
<text x="113.3" y="266.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">route</text>
<rect x="218.7" y="168.0" width="178.7" height="126.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="308.0" y="183.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Cognitive</text>
<text x="308.0" y="205.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">functions</text>
<text x="308.0" y="229.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">what must be</text>
<text x="308.0" y="248.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">thought, and by how</text>
<text x="308.0" y="267.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">many independent</text>
<text x="308.0" y="286.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">minds</text>
<path d="M 204.66666666666666 231 L 215.66666666666666 231" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="413.3" y="168.0" width="178.7" height="126.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="502.7" y="204.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Cohort</text>
<text x="502.7" y="228.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">minimum sufficient</text>
<text x="502.7" y="247.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">— no spare actor,</text>
<text x="502.7" y="266.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">no cut expertise</text>
<path d="M 399.3333333333333 231 L 410.3333333333333 231" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="608.0" y="168.0" width="178.7" height="126.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="697.3" y="204.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Runtime match</text>
<text x="697.3" y="228.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">which qualified</text>
<text x="697.3" y="247.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">profile can satisfy</text>
<text x="697.3" y="266.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">each function</text>
<path d="M 594.0 231 L 605.0 231" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="802.7" y="168.0" width="178.7" height="126.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="892.0" y="204.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Deployment plan</text>
<text x="892.0" y="228.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">backend-neutral:</text>
<text x="892.0" y="247.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">topology, embargo,</text>
<text x="892.0" y="266.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">skills, workspaces</text>
<path d="M 788.6666666666666 231 L 799.6666666666666 231" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="997.3" y="168.0" width="178.7" height="126.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="1086.7" y="204.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Sessions</text>
<text x="1086.7" y="228.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">projected onto the</text>
<text x="1086.7" y="247.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">backend and</text>
<text x="1086.7" y="266.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">attached over ACP</text>
<path d="M 983.3333333333333 231 L 994.3333333333333 231" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="24.0" y="318.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">AETHRION decides all six. The last two are projections of the first four, never inputs to them.</text>
<path d="M 24 338 L 1176 338" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24.0" y="366.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">Five levels, and the failure that follows from collapsing each into the next</text>
<text x="38.0" y="388.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#63666A" text-anchor="start">Level</text>
<text x="338.0" y="388.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#63666A" text-anchor="start">What it is</text>
<text x="682.0" y="388.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">Collapse it and</text>
<rect x="24.0" y="394.0" width="300.0" height="76.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="38.0" y="424.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">RoleContract / RoleBinding</text>
<text x="338.0" y="420.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">governance authority — who may</text>
<text x="338.0" y="441.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">decide what</text>
<text x="682.0" y="420.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">a backend identity starts implying authority nobody granted it</text>
<rect x="24.0" y="480.0" width="300.0" height="76.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="38.0" y="510.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Cognitive function</text>
<text x="338.0" y="506.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">the epistemic job — Statistician,</text>
<text x="338.0" y="527.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Adversarial Reviewer</text>
<text x="682.0" y="506.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">independence stops being measurable, because the profile has</text>
<text x="682.0" y="527.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">nothing to measure</text>
<rect x="24.0" y="566.0" width="300.0" height="76.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="38.0" y="596.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Model profile</text>
<text x="338.0" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">the admitted model and its snapshot</text>
<text x="682.0" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">requalification silently stops applying</text>
<rect x="24.0" y="652.0" width="300.0" height="76.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="38.0" y="682.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Runtime profile</text>
<text x="338.0" y="678.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">the harness executing the loop</text>
<text x="682.0" y="678.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">“we used Hermes” starts being offered as a description of the</text>
<text x="682.0" y="699.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">method</text>
<rect x="24.0" y="738.0" width="300.0" height="76.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="38.0" y="768.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="start">Backend identity</text>
<text x="338.0" y="764.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">the operational actor in a room</text>
<text x="682.0" y="764.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">attribution is mistaken for authorisation</text>
<rect x="24.0" y="850.0" width="1152.0" height="132.0" rx="4" fill="#fcf4ed" stroke="#D55E00" stroke-width="1.8"/>
<text x="42.0" y="880.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">Compilation refuses — it does not warn</text>
<text x="46.0" y="904.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">·  too few independent contributions for a substantial task</text>
<text x="46.0" y="924.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">·  a required specialist with no qualified runtime</text>
<text x="46.0" y="944.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">·  a backend that cannot enforce round-zero isolation</text>
<text x="46.0" y="964.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">·  a skill bundle that cannot be materialised</text>
<text x="606.0" y="904.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">·  a verifier independence that cannot be satisfied</text>
<text x="606.0" y="924.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">·  a message type or capability the backend does not support</text>
<text x="606.0" y="944.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">·  a budget that fits only by dropping cohort or assurance</text>
</svg>
