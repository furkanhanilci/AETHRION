<text x="24.0" y="1150.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#63666A" text-anchor="start">Status: nothing in this figure is built. WP-144 and WP-145 specify it; there is no search graph, no selector, no governor and no campaign runtime.</text>
