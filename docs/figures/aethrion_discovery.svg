<text x="40.0" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">A candidate that fails to compile has said nothing about the hypothesis. Recorded as &quot;tried a different approach&quot;, an implementation defect becomes</text>
<text x="40.0" y="378.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">evidence about a scientific question — and the record cannot be told apart from one where the idea genuinely failed. ACC-64.</text>
<text x="24.0" y="414.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">2 · Edge classes — what may change an ancestry, and what may not</text>
