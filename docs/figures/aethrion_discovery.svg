<text x="42.0" y="1064.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">The forbidden conversion</text>
<text x="42.0" y="1086.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">A selection score, a normalised rank, a tournament position and a frontier metric are all priorities for spending compute. Writing any of them into</text>
