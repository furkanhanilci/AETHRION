<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="100%" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="1000" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">Where things live, and which way they move</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Three surfaces, and only one of them is authoritative. Everything is written in the Git repository. The Obsidian vault is produced from it:</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">generated pages are replaced, hand-authored ones are protected and never edited back into the repository. External bibliographic services</text>
<text x="24.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">are read at verification time and their answers are recorded, never assumed. Every arrow below points one way, and that is the design, not</text>
<text x="24.0" y="152.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">a simplification of it.</text>
<rect x="24.0" y="186.0" width="330.0" height="456.0" rx="4" fill="#f0f7fa" stroke="#0072B2" stroke-width="2.2"/>
<text x="40.0" y="216.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#0072B2" text-anchor="start">Git repository</text>
<text x="40.0" y="238.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">The single source of truth. Authored by</text>
<text x="40.0" y="259.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">humans and agents; reviewed as a diff.</text>
<rect x="40.0" y="282.0" width="298.0" height="66.0" rx="4" fill="#e1e1e1" stroke="#1A1A1A" stroke-width="1.6"/>
<text x="189.0" y="297.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Hand-authored</text>
<text x="189.0" y="320.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">architecture, decision records,</text>
<text x="189.0" y="339.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">planning corpus, skills</text>
<rect x="40.0" y="356.0" width="298.0" height="66.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="189.0" y="371.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Generated, committed</text>
<text x="189.0" y="394.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">STATUS.md, workstream indexes,</text>
<text x="189.0" y="413.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">figures — never hand-edited</text>
<rect x="40.0" y="430.0" width="298.0" height="66.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="189.0" y="445.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Sealed</text>
<text x="189.0" y="468.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">632 planning files, byte-identical to</text>
<text x="189.0" y="487.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">baseline v1.3.4</text>
<rect x="40.0" y="504.0" width="298.0" height="66.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="189.0" y="519.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Signed</text>
<text x="189.0" y="542.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">evidence manifests, Ed25519,</text>
<text x="189.0" y="561.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">interim profile</text>
<text x="398.0" y="216.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#63666A" text-anchor="start">Transforms</text>
<text x="398.0" y="238.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Deterministic, re-runnable, and each one</text>
<text x="398.0" y="259.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">has a --check mode that fails on drift.</text>
<rect x="398.0" y="282.0" width="300.0" height="66.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="548.0" y="297.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">make_figures.py</text>
<text x="548.0" y="320.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">regenerates all figures, then</text>
<text x="548.0" y="339.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">re-measures them independently</text>
<path d="M 360 329 L 392 329" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="398.0" y="356.0" width="300.0" height="66.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="548.0" y="371.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">write_status.py</text>
<text x="548.0" y="394.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">re-derives the status page from the</text>
<text x="548.0" y="413.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">bundle it just ran</text>
<path d="M 360 403 L 392 403" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="398.0" y="430.0" width="300.0" height="66.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="548.0" y="445.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">make_plan_indexes.py</text>
<text x="548.0" y="468.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">rebuilds every workstream index</text>
<text x="548.0" y="487.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">from its directory</text>
<path d="M 360 477 L 392 477" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="398.0" y="504.0" width="300.0" height="66.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="548.0" y="519.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">mirror_vault.py</text>
<text x="548.0" y="542.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">projects documents and figures into</text>
<text x="548.0" y="561.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the vault layout</text>
<path d="M 360 551 L 392 551" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="742.0" y="186.0" width="434.0" height="456.0" rx="4" fill="#f0f9f7" stroke="#009E73" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="758.0" y="216.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#009E73" text-anchor="start">Obsidian vault</text>
<text x="758.0" y="238.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">A reading surface. Generated pages are replaced on</text>
<text x="758.0" y="259.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">every mirror run; a page marked generated: false is</text>
<text x="758.0" y="280.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">refused, not overwritten.</text>
<rect x="758.0" y="296.0" width="402.0" height="66.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="959.0" y="320.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">01–03</text>
<text x="959.0" y="343.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">Overview, decisions, implementation notes</text>
<path d="M 704 315 L 752 315" fill="none" stroke="#009E73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="758.0" y="370.0" width="402.0" height="66.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="959.0" y="394.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">04</text>
<text x="959.0" y="417.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">Architecture, with the figures copied alongside</text>
<path d="M 704 389 L 752 389" fill="none" stroke="#009E73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="758.0" y="444.0" width="402.0" height="66.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="959.0" y="468.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">05</text>
<text x="959.0" y="491.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">Evidence, including the mirrored status page</text>
<path d="M 704 463 L 752 463" fill="none" stroke="#009E73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="758.0" y="518.0" width="402.0" height="66.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="959.0" y="542.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">06–09</text>
<text x="959.0" y="565.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">Planning corpus, reporting, reference material</text>
<path d="M 704 537 L 752 537" fill="none" stroke="#009E73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="758.0" y="598.0" width="402.0" height="30.0" rx="4" fill="#faece0" stroke="#D55E00" stroke-width="1.4"/>
<text x="959.0" y="619.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="middle">no path leads back</text>
<rect x="24.0" y="676.0" width="1152.0" height="148.0" rx="4" fill="#fefaf2" stroke="#E69F00" stroke-width="2.0" stroke-dasharray="6 4"/>
<text x="40.0" y="706.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#E69F00" text-anchor="start">Outside world — read-only, and recorded when read</text>
<rect x="40.0" y="734.0" width="269.5" height="74.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="174.8" y="753.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Crossref</text>
<text x="174.8" y="776.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">primary DOI resolution; title</text>
<text x="174.8" y="795.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">match at 0.82</text>
<rect x="323.5" y="734.0" width="269.5" height="74.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="458.2" y="762.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">OpenAlex</text>
<text x="458.2" y="785.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">fallback when Crossref is silent</text>
<rect x="607.0" y="734.0" width="269.5" height="74.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="741.8" y="753.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">arXiv</text>
<text x="741.8" y="776.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">preprints and identifiers Crossref</text>
<text x="741.8" y="795.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">does not hold</text>
<rect x="890.5" y="734.0" width="269.5" height="74.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="1025.2" y="753.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Positive control</text>
<text x="1025.2" y="776.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">a known-live DOI; if it goes quiet,</text>
<text x="1025.2" y="795.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the sweep fails loudly</text>
<path d="M 600.0 676 L 600.0 648" fill="none" stroke="#E69F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrowsm)"/>
<path d="M 24 850 L 1176 850" fill="none" stroke="#C8C8C8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24.0" y="880.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">Reality</text>
<text x="104.0" y="880.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Of 33 registered references, 27 verify against these services and 18 carry no DOI at all, which is why the sweep reports coverage rather</text>
<text x="104.0" y="903.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">than a pass. The mirror is one-way for GENERATED pages and refuses outright on hand-authored ones: a page whose frontmatter says</text>
<text x="104.0" y="926.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">generated: false is never written over. So the failure mode of editing a generated page is losing that edit; editing your own note is safe.</text>
</svg>
