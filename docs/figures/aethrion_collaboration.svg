<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1420" width="100%" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="1420" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">The collaboration plane: keep the cohort, prune the conversation</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Substantial scientific execution needs at least two epistemically independent contributions, and that is an epistemic requirement rather than</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">a capability one — a cost argument cannot answer it. So the cohort is fixed and the conversation is optimised. Everything below is a way of</text>
<text x="24.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">spending fewer tokens without losing the second look.</text>
<text x="24.0" y="166.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">1 · Independence is a profile, not a count</text>
<rect x="24.0" y="188.0" width="219.2" height="104.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="133.6" y="222.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">cognitive function</text>
<text x="133.6" y="245.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">methodologist ·</text>
<text x="133.6" y="264.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">statistician · skeptic</text>
<rect x="257.2" y="188.0" width="219.2" height="104.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="366.8" y="222.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">evidence exposure</text>
<text x="366.8" y="245.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">same evidence, or</text>
<text x="366.8" y="264.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">different subsets</text>
<rect x="490.4" y="188.0" width="219.2" height="104.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="600.0" y="231.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">peer visibility</text>
<text x="600.0" y="254.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">did it see the other first</text>
<rect x="723.6" y="188.0" width="219.2" height="104.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="833.2" y="231.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">model profile</text>
<text x="833.2" y="254.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">necessary, not sufficient</text>
<rect x="956.8" y="188.0" width="219.2" height="104.0" rx="4" fill="#ebebec" stroke="#63666A" stroke-width="1.6"/>
<text x="1066.4" y="222.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">prompt perspective</text>
<text x="1066.4" y="245.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">different framing, or the</text>
<text x="1066.4" y="264.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">same twice</text>
<rect x="24.0" y="308.0" width="1152.0" height="56.0" rx="4" fill="#fbefe6" stroke="#D55E00" stroke-width="1.6"/>
<text x="40.0" y="332.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Five instances of one model on one context are ONE contribution. They will agree, and the agreement carries no information — which is why a</text>
<text x="40.0" y="353.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">cohort of identical profiles is refused and a cohort of three differentiated ones passes. ACC-081.</text>
<text x="24.0" y="400.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">2 · Independent-first — the order is the mechanism</text>
<rect x="24.0" y="426.0" width="210.0" height="96.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="129.0" y="466.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">round 0</text>
<text x="129.0" y="490.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">peer output hidden</text>
<rect x="256.0" y="426.0" width="210.0" height="96.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="361.0" y="466.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">position</text>
<text x="361.0" y="490.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">each actor writes its own</text>
<path d="M 237 474.0 L 251 474.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="488.0" y="426.0" width="210.0" height="96.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="593.0" y="456.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">SEAL</text>
<text x="593.0" y="480.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">digests fixed, and</text>
<text x="593.0" y="499.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">checkable later</text>
<path d="M 469 474.0 L 483 474.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="720.0" y="426.0" width="210.0" height="96.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="825.0" y="456.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">deltas</text>
<text x="825.0" y="480.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">only material differences</text>
<text x="825.0" y="499.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">exposed</text>
<path d="M 701 474.0 L 715 474.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="952.0" y="426.0" width="210.0" height="96.0" rx="4" fill="#f8eef4" stroke="#CC79A7" stroke-width="1.6"/>
<text x="1057.0" y="456.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">converge</text>
<text x="1057.0" y="480.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">no unresolved material</text>
<text x="1057.0" y="499.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">challenge</text>
<path d="M 933 474.0 L 947 474.0" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 477 414 L 477 534" fill="none" stroke="#D55E00" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="477.0" y="406.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="middle">embargo lifts here</text>
<text x="24.0" y="538.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Anchoring is an effect, not a preference: an actor shown a confident prior answer converges on it, and the record afterwards shows two agreeing</text>
<text x="24.0" y="560.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">actors — indistinguishable from two that independently agreed. The seal is the only thing that tells them apart later. A majority cannot close a</text>
<text x="24.0" y="582.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">skeptic&#x27;s unanswered objection — ACC-082, ACC-090.</text>
<text x="24.0" y="634.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">3 · What crosses an edge, and what never does</text>
<rect x="24.0" y="658.0" width="563.0" height="148.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="305.5" y="696.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Typed delta + pointer</text>
<text x="305.5" y="721.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">Ten message types, because a CHALLENGE can be tracked to</text>
<text x="305.5" y="740.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">resolution and a paragraph cannot. The message carries the change and</text>
<text x="305.5" y="759.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">a digest; the content goes to the artifact store. Delete the blackboard and</text>
<text x="305.5" y="778.1" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">no canonical science is lost — ACC-084, ACC-085.</text>
<rect x="613.0" y="658.0" width="563.0" height="148.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="894.5" y="705.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">Never: a transcript</text>
<text x="894.5" y="730.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">A full reasoning transcript passed between agents is a channel through</text>
<text x="894.5" y="749.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">which one agent&#x27;s error becomes another&#x27;s premise. The token saving is</text>
<text x="894.5" y="768.6" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">the obvious reason to refuse it; that is the other one.</text>
<text x="24.0" y="842.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">4 · What budget pressure degrades — and the floor it cannot cross</text>
<rect x="24.0" y="868.0" width="276.0" height="58.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="162.0" y="900.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">structured full</text>
<rect x="316.0" y="868.0" width="276.0" height="58.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="454.0" y="900.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">compressed</text>
<path d="M 303.0 897 L 312.0 897" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="608.0" y="868.0" width="276.0" height="58.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="746.0" y="900.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">pointer only</text>
<path d="M 595.0 897 L 604.0 897" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="900.0" y="868.0" width="276.0" height="58.0" rx="4" fill="#fcf3de" stroke="#E69F00" stroke-width="1.6"/>
<text x="1038.0" y="900.8" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">silence unless material</text>
<path d="M 887.0 897 L 896.0 897" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<rect x="24.0" y="940.0" width="1152.0" height="92.0" rx="4" fill="#fbefe6" stroke="#D55E00" stroke-width="2.2"/>
<text x="42.0" y="968.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">The floor: what budget may never reach</text>
<text x="42.0" y="992.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">The cohort. The assurance route. Any non-waivable control. A BLOCKER or a safety message at any utility threshold. A task that cannot afford</text>
<text x="42.0" y="1014.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">its required assurance is BLOCKED_BUDGET or asks for a scope reduction — it does not proceed more cheaply. ACC-088, ACC-099,</text>
<text x="42.0" y="1036.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">ACC-101.</text>
<text x="24.0" y="1062.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">5 · The optimisation is anchored, or it is not an optimisation</text>
<text x="24.0" y="1086.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Accepted only when quality stays inside a declared tolerance and coordination cost falls meaningfully. A regression rolls the topology back</text>
<text x="24.0" y="1108.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">automatically. The baseline is the naive fully-connected cohort — not a single agent, because comparing to one agent measures the cost of having a</text>
<text x="24.0" y="1130.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">cohort at all, which is a decision already taken on other grounds. ACC-086, ACC-087.</text>
<text x="24.0" y="1198.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Status: none of this is built. WP-148 to WP-150 and WP-153 specify it; there is no cohort record, no blackboard, no topology compiler, no governor and no</text>
<text x="24.0" y="1219.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">baseline harness to measure any of it against.</text>
</svg>
