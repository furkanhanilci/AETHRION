<text x="24.0" y="76.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">Nothing becomes knowledge by being asserted. It becomes knowledge by surviving a chain in which every link is addressable</text>
