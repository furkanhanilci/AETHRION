<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1064" width="100%" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#C8C8C8" stroke-width="2.2"/>
  </pattern>
</defs>
<rect width="1200" height="1064" fill="#FFFFFF"/>
<text x="24.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">Two disciplines, and the four pairs that get conflated</text>
<text x="24.0" y="80.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">A research adaptation EXTENDS its engineering counterpart; it does not replace it. Building the ledger that stores preregistrations is</text>
<text x="24.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">test-driven-development work, however scientific the noun sounds. The four rows below are the places that rule is hardest to hold, because</text>
<text x="24.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#63666A" text-anchor="start">each pair commits to something before an outcome and the resemblance stops there.</text>
<text x="158.0" y="166.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#0072B2" text-anchor="middle">ENGINEERING</text>
<text x="600.0" y="166.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="middle">substituting one for the other produces…</text>
<text x="1042.0" y="166.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#009E73" text-anchor="middle">SCIENTIFIC</text>
<path d="M 24 178 L 1176 178" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24.0" y="194.0" width="268.0" height="74.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="158.0" y="234.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">test-driven-development</text>
<rect x="908.0" y="194.0" width="268.0" height="74.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="1042.0" y="234.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">preregistration-discipline</text>
<path d="M 296 231 L 328 231" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 904 231 L 872 231" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="340.0" y="216.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Passing tests on an analysis reshaped after seeing the data is a</text>
<text x="340.0" y="236.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">correct implementation of a compromised study.</text>
<rect x="24.0" y="304.0" width="1152.0" height="108.0" rx="4" fill="#f7f7f8" stroke="none" stroke-width="0"/>
<rect x="24.0" y="310.0" width="268.0" height="74.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="158.0" y="350.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">requesting-code-review</text>
<rect x="908.0" y="310.0" width="268.0" height="74.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="1042.0" y="339.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">requesting-review ·</text>
<text x="1042.0" y="360.9" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">adversarial-reviewing</text>
<path d="M 296 347 L 328 347" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 904 347 L 872 347" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="340.0" y="332.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">A reviewer who approves the diff has said nothing about the inference.</text>
<rect x="24.0" y="426.0" width="268.0" height="74.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="158.0" y="466.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">systematic-debugging</text>
<rect x="908.0" y="426.0" width="268.0" height="74.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="1042.0" y="466.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">investigating-anomalies</text>
<path d="M 296 463 L 328 463" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 904 463 L 872 463" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="340.0" y="448.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">Debugging assumes the expectation is right. Treating every anomaly</text>
<text x="340.0" y="468.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">as a bug is how a discovery gets fixed.</text>
<rect x="24.0" y="536.0" width="1152.0" height="108.0" rx="4" fill="#f7f7f8" stroke="none" stroke-width="0"/>
<rect x="24.0" y="542.0" width="268.0" height="74.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="158.0" y="582.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">dispatching-parallel-agents</text>
<rect x="908.0" y="542.0" width="268.0" height="74.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="1042.0" y="582.4" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">dispatching-parallel-analysts</text>
<path d="M 296 579 L 328 579" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<path d="M 904 579 L 872 579" fill="none" stroke="#C8C8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowsm)"/>
<text x="340.0" y="564.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">One decomposes work with a single right answer. The other produces</text>
<text x="340.0" y="584.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">a spread, because the answer is not known.</text>
<path d="M 24 662 L 1176 662" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24.0" y="688.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#1A1A1A" text-anchor="start">Why this is a control and not a glossary</text>
<rect x="24.0" y="714.0" width="372.0" height="118.0" rx="4" fill="#deedf5" stroke="#0072B2" stroke-width="1.6"/>
<text x="210.0" y="746.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">different families</text>
<text x="210.0" y="770.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">each half carries a different airl.domain, so a</text>
<text x="210.0" y="789.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">router that sees one family cannot choose</text>
<text x="210.0" y="808.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">between them</text>
<rect x="414.0" y="714.0" width="372.0" height="118.0" rx="4" fill="#faeade" stroke="#D55E00" stroke-width="1.6"/>
<text x="600.0" y="746.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">both halves routable</text>
<text x="600.0" y="770.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">a scientific half unreachable while its</text>
<text x="600.0" y="789.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">engineering counterpart is routable sends the</text>
<text x="600.0" y="808.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">task to the wrong one</text>
<rect x="804.0" y="714.0" width="372.0" height="118.0" rx="4" fill="#def2ed" stroke="#009E73" stroke-width="1.6"/>
<text x="990.0" y="746.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#1A1A1A" text-anchor="middle">R3, with a mutation</text>
<text x="990.0" y="770.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">collapse a pair into one family and the rule</text>
<text x="990.0" y="789.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">must refuse — a check nobody has watched</text>
<text x="990.0" y="808.3" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#63666A" text-anchor="middle">fail is not a check</text>
<rect x="24.0" y="854.0" width="1152.0" height="86.0" rx="4" fill="#fbefe6" stroke="#D55E00" stroke-width="2.2"/>
<text x="42.0" y="882.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#D55E00" text-anchor="start">The failure this prevented, already once</text>
<text x="42.0" y="904.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">dispatching-parallel-analysts was reachable by no chain of references from the router while dispatching-parallel-agents sat in its table. A task</text>
<text x="42.0" y="926.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">needing independent analyses would have routed to the one that decomposes work with a single right answer — not through a bad judgement,</text>
<text x="42.0" y="948.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="start">but through the correct option being absent.</text>
</svg>
